name: jmlis
description: JMlis — 现代跨平台漫画阅读器 (LAN 服务端 + 外出直连)
publish_to: "none"
version: 2.1.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  crypto: ^3.0.6
  encrypt: ^5.0.3
  image: ^4.5.3
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  socks5_proxy: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: false
  assets:
    - assets/icon/app_icon.png
