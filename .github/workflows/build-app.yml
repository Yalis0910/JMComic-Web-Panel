name: CI & Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  server-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies & run pytest
        run: |
          pip install -e "./server[dev]"
          pytest server/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build

  flutter-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Bootstrap Android runner
        working-directory: mobile
        run: |
          flutter create . --platforms=android --project-name jmcomic_panel_app --org com.jmcomic.panel
          rm -f test/widget_test.dart
      - name: Configure AndroidManifest network permissions
        working-directory: mobile
        run: |
          python3 -c '
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in text:
              text = text.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application", 1)
          if "usesCleartextTraffic" not in text:
              text = text.replace("<application", "<application\n        android:usesCleartextTraffic=\"true\"", 1)
          manifest.write_text(text, encoding="utf-8")
          '
      - name: Install Flutter packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: mobile
        run: |
          set +e
          flutter analyze > analyze.log 2>&1
          code=$?
          cat analyze.log
          python3 -c '
          for line in open("analyze.log", encoding="utf-8"):
              s = line.strip()
              if s.startswith("error ") or s.startswith("warning ") or "error -" in s or "warning -" in s:
                  print(f"::error::{s}")
          '
          exit $code
      - name: Run Flutter unit tests
        working-directory: mobile
        run: flutter test
      - name: Build Android Release APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-hybrid-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
