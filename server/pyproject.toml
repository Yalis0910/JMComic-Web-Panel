[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jmlis-server"
version = "2.0.0"
description = "JMlis Local/LAN Backend Server (FastAPI + SQLite + JMComic)"
requires-python = ">=3.10"
dependencies = [
    "jmcomic>=2.6.20",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pillow>=10.0.0",
    "pycryptodome>=3.20.0",
    "pyyaml>=6.0",
    "img2pdf>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
jm-server = "app.main:start"
